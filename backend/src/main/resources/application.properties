spring.application.name=RoofTopll
server.port=8080


mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.ll.rooftopll.entity
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.map-underscore-to-camel-case=true

# JWT
jwt.secret=${JWT_SECRET:default_secret_key_change_in_production}
jwt.expiration=604800


spring.datasource.url=jdbc:mysql://localhost:3306/powerlifting_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.com.ll.rooftopll.mapper=debug
logging.level.org.mybatis=debug